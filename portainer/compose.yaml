services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - default
      - caddynet

volumes:
  portainer_data:
    name: portainer_data

networks:
  default:
    name: portainer_network
  caddynet:
    name: caddynet 
    external: true